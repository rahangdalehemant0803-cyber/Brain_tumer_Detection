<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ code }} — NeuroScan AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body style="display:flex; align-items:center; justify-content:center; min-height:100vh;">
  <div style="text-align:center;">
    <div style="font-family: var(--font-display); font-size: 72px; font-weight:700; color: var(--primary);">{{ code }}</div>
    <p style="color: var(--text-muted); font-size: 15px; margin-bottom: 24px;">{{ message }}</p>
    <a href="{{ url_for('index') }}" class="btn btn-primary">Go home</a>
  </div>
</body>
</html>
